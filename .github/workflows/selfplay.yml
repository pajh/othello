name: NN self-play collection

# Manual only. This workflow is never triggered by a push, a pull request, a
# schedule or a repository event: the user starts it from the Actions page and
# chooses the seed, game count, worker count and checkpoint. Collection is the
# only milestone here; there is no conversion, training or publication step.

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of self-play games to collect'
        required: true
        type: number
        default: 5000
      seed:
        description: 'Master seed. The user chooses one; there is no default.'
        required: true
        type: number
      workers:
        description: 'Worker processes (four on the standard public runner)'
        required: true
        type: number
        default: 4
      checkpoint:
        description: 'Repository-relative checkpoint path supplied by checkout'
        required: true
        type: string
        default: models/first-model.pt

# Read-only is enough: checkout uses persist-credentials false, and nothing
# here commits, pushes or publishes anything.
permissions:
  contents: read

jobs:
  collect:
    name: Collect NN self-play
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pinned CPU dependencies and the project
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3
          python -m pip install --no-deps -e .

      - name: Record runtime provenance
        env:
          GAMES: ${{ inputs.games }}
          SEED: ${{ inputs.seed }}
          WORKERS: ${{ inputs.workers }}
          CHECKPOINT: ${{ inputs.checkpoint }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUNNER_CPU_COUNT: ${{ runner.cpu_count }}
        run: |
          mkdir -p runs/github-selfplay
          python - <<'PY'
          import os
          import sys

          import numpy
          import torch

          lines = [
              'GitHub-hosted collection runtime record',
              'commit: %s' % os.environ.get('RUN_SHA', 'unknown'),
              'ref: %s' % os.environ.get('REF_NAME', 'unknown'),
              'repository: %s' % os.environ.get('REPOSITORY', 'unknown'),
              'run id: %s' % os.environ.get('RUN_ID', 'unknown'),
              'run attempt: %s' % os.environ.get('RUN_ATTEMPT', 'unknown'),
              'runner CPUs: %s' % os.environ.get('RUNNER_CPU_COUNT', 'unknown'),
              'python: %s' % sys.version.split()[0],
              'torch: %s' % torch.__version__,
              'numpy: %s' % numpy.__version__,
              'games requested: %s' % os.environ['GAMES'],
              'seed: %s' % os.environ['SEED'],
              'workers requested: %s' % os.environ['WORKERS'],
              'checkpoint input: %s' % os.environ['CHECKPOINT'],
              'The helper records the resolved checkpoint path and bot IDs in',
              'collection-provenance.json inside the run directory.',
          ]
          text = '\n'.join(lines) + '\n'
          with open('runs/github-selfplay/workflow-runtime.txt', 'w',
                    encoding='utf-8') as stream:
              stream.write(text)
          print(text, end='')
          PY

      - name: Collect
        env:
          GAMES: ${{ inputs.games }}
          SEED: ${{ inputs.seed }}
          WORKERS: ${{ inputs.workers }}
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          python scripts/nn_selfplay_collect.py \
            --games "$GAMES" \
            --seed "$SEED" \
            --workers "$WORKERS" \
            --checkpoint "$CHECKPOINT" \
            --output-dir runs/github-selfplay

      # Runs even when collection fails, so completed games, the run metadata,
      # the provenance files and the summaries are retained rather than lost.
      # Repository-default retention; the artifact name is unique per attempt,
      # so nothing is overwritten.
      - name: Upload collection output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selfplay-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/github-selfplay/
          if-no-files-found: warn

      - name: Job summary
        if: always()
        env:
          GAMES: ${{ inputs.games }}
          SEED: ${{ inputs.seed }}
          WORKERS: ${{ inputs.workers }}
          CHECKPOINT: ${{ inputs.checkpoint }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## NN self-play collection'
            echo
            echo "Job status: $JOB_STATUS"
            echo "Requested: $GAMES games, seed $SEED, $WORKERS workers"
            echo "Checkpoint input: $CHECKPOINT"
            echo "Run page (artifact downloads from here): https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
            echo "Artifact name: selfplay-$RUN_ID-$RUN_ATTEMPT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for file in runs/github-selfplay/run-summary.txt runs/github-selfplay/match-check.txt; do
            if [ -f "$file" ]; then
              {
                echo "<details><summary>$(basename "$file")</summary>"
                echo
                echo '```'
                cat "$file"
                echo '```'
                echo
                echo '</details>'
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
